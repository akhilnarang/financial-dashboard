[project]
name = "financial-dashboard"
version = "0.1.0"
description = "Self-hosted bank transaction email fetcher and dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.14.2,<3",
    "rich>=14.0,<16",
    "uvicorn[standard]>=0.34,<1",
    "jinja2>=3.1,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.28,<1",
    "bank-email-parser",
    "bank-sms-parser",
    "bank-statement-parser",
    "cas-parser",
    "cc-parser",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.135,<1",
    "cryptography>=49.0.0,<51",
    "python-telegram-bot>=22.7,<23",
    "python-dateutil>=2.9.0.post0",
    "google-genai>=1.75,<3",
    "openai>=1.109,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "financial_dashboard.main:create_app"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
# Only resolve to artifacts that PyPI has served for three days. A freshly
# published malicious version has had no time to be found and yanked, and
# this repo handles the user's bank data.
exclude-newer = "3 days"

[tool.uv.sources]
bank-email-parser = { git = "https://github.com/akhilnarang/bank-email-parser" }
bank-sms-parser = { git = "https://github.com/akhilnarang/bank-sms-parser" }
bank-statement-parser = { git = "https://github.com/akhilnarang/bank-statement-parser" }
cas-parser = { git = "https://github.com/akhilnarang/cas-parser" }
cc-parser = { git = "https://github.com/akhilnarang/cc-parser" }

[dependency-groups]
dev = [
    "beancount>=3.2.3",
    "pytest>=9.0,<10",
    "pytest-anyio>=0.0.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
