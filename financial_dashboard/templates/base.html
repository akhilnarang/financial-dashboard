<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ledger{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css">
    <script defer src="https://unpkg.com/@knadh/oat/oat.min.js"></script>
    <script defer src="/static/js/filter-form.js"></script>
    <style>
        /* ---------------------------------------------------------------
           Root & Typography
        --------------------------------------------------------------- */
        :root {
            --app-max-width: 1600px;
            --clr-debit: #dc2626;
            --clr-credit: #16a34a;
            --clr-pending-bg: #fef3c7;
            --clr-pending-fg: #92400e;
            --surface-muted: #f5f5f4;
            --surface-inset: #ececea;
            --border-light: #e7e5e4;
            --nav-pill-hover: rgba(0, 0, 0, 0.06);
            --nav-pill-active-bg: #1c1917;
            --nav-pill-active-fg: #fafaf9;
            --font-body: 'DM Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --clr-debit: #f87171;
                --clr-credit: #4ade80;
                --clr-pending-bg: #422006;
                --clr-pending-fg: #fde68a;
                --surface-muted: #1c1917;
                --surface-inset: #262220;
                --border-light: #34302c;
                --nav-pill-hover: rgba(255, 255, 255, 0.08);
                --nav-pill-active-bg: #fafaf9;
                --nav-pill-active-fg: #1c1917;
            }
        }

        body {
            font-family: var(--font-body);
            max-width: var(--app-max-width);
            margin: 0 auto;
            padding: 0 1.5rem 2rem;
            line-height: 1.55;
        }

        /* ---------------------------------------------------------------
           Header & Navigation
        --------------------------------------------------------------- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .app-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .app-title a {
            text-decoration: none;
            color: inherit;
        }

        .app-nav {
            display: flex;
            gap: 0.2rem;
            flex-wrap: wrap;
        }

        .app-nav a {
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            color: inherit;
            transition: background 0.15s ease;
        }

        .app-nav a:hover {
            background: var(--nav-pill-hover);
        }

        .app-nav a[aria-current="page"] {
            background: var(--nav-pill-active-bg);
            color: var(--nav-pill-active-fg);
            font-weight: 600;
        }

        /* ---------------------------------------------------------------
           Stats Grid
        --------------------------------------------------------------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            text-align: center;
            padding: 1.25rem 1rem;
        }

        .stat-card dl {
            margin: 0;
        }

        .stat-card dt {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.55;
            margin-bottom: 0.3rem;
        }

        .stat-card dd {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.2;
        }

        /* ---------------------------------------------------------------
           Amount Formatting
        --------------------------------------------------------------- */
        .amt {
            font-family: var(--font-mono);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .amt-debit {
            color: var(--clr-debit);
        }

        .amt-credit {
            color: var(--clr-credit);
        }

        /* ---------------------------------------------------------------
           Tables
        --------------------------------------------------------------- */
        .table {
            overflow-x: auto;
        }

        /* Wide screens: let dense tables span the full container without
           horizontal scroll (10+ column tables fit naturally above this). */
        @media (min-width: 1400px) {
            .table {
                overflow-x: visible;
            }
        }

        .table table {
            white-space: nowrap;
            width: 100%;
        }

        .table td,
        .table th {
            padding: 0.5rem 0.75rem;
            font-size: 0.88rem;
        }

        .table th {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            opacity: 0.55;
        }

        .table tbody tr:hover {
            background: var(--nav-pill-hover);
        }

        .table tbody.adj-pair-group:hover tr {
            background: var(--nav-pill-hover);
        }

        .table tbody.adj-pair-group + tbody.adj-pair-group tr:first-child {
            border-top: 2px solid var(--border-light);
        }

        /* ---------------------------------------------------------------
           Section Headers
        --------------------------------------------------------------- */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .section-header h2 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* ---------------------------------------------------------------
           Filter Bar
        --------------------------------------------------------------- */
        .filter-bar {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            background: var(--surface-muted);
            border: 1px solid var(--border-light);
        }

        .filter-bar label[data-field] {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 120px;
            margin-block-end: 0;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .filter-bar select,
        .filter-bar input,
        .filter-bar button,
        .filter-bar [role="button"] {
            margin-block-end: 0;
        }

        /* ---------------------------------------------------------------
           Status Badges
        --------------------------------------------------------------- */
        .badge-pending {
            background: var(--clr-pending-bg);
            color: var(--clr-pending-fg);
        }

        .badge.success-outline {
            background: transparent;
            color: var(--clr-credit);
            border: 1px solid var(--clr-credit);
        }

        /* ---------------------------------------------------------------
           Utilities
        --------------------------------------------------------------- */
        .text-muted {
            opacity: 0.55;
        }

        .text-sm {
            font-size: 0.82rem;
        }

        .truncate {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            vertical-align: middle;
        }

        .cell-counterparty small {
            display: block;
            opacity: 0.5;
            font-size: 0.78rem;
            line-height: 1.3;
        }

        .result-count {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 600;
            opacity: 0.55;
        }

        /* Strip button chrome so <button>s in action columns blend with
           adjacent text links (e.g. "Email · Mark Paid · Delete"). */
        .btn-link {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font: inherit;
            color: inherit;
            cursor: pointer;
        }
        .btn-link:hover { text-decoration: underline; }
        .btn-link.danger { color: var(--clr-debit); }
        .btn-link.success { color: var(--clr-credit); }

        /* Pill action button; pair with .btn-action-count for an inline counter. */
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            border: 1px solid var(--border-light);
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: -0.005em;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            line-height: 1.1;
        }
        .btn-action:hover:not(:disabled) {
            background: var(--nav-pill-hover);
            border-color: color-mix(in srgb, var(--border-light) 60%, currentColor 40%);
        }
        .btn-action:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .btn-action-count {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.05rem 0.4rem;
            border-radius: 999px;
            background: var(--surface-inset);
            color: var(--clr-debit);
            letter-spacing: 0;
        }

        /* Primary/ghost modifiers for .btn-action — opt in for form CTAs. */
        .btn-action.btn-primary {
            background: var(--nav-pill-active-bg);
            color: var(--nav-pill-active-fg);
            border-color: var(--nav-pill-active-bg);
            font-weight: 600;
        }
        .btn-action.btn-primary:hover:not(:disabled) {
            filter: brightness(1.1);
            border-color: var(--nav-pill-active-bg);
        }
        .btn-action.btn-ghost {
            border-color: transparent;
            opacity: 0.75;
        }
        .btn-action.btn-ghost:hover:not(:disabled) {
            opacity: 1;
            background: var(--surface-muted);
        }
        a.btn-action { text-decoration: none; }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
        }

        .empty-state p:first-child {
            font-weight: 600;
        }

        /* ---------------------------------------------------------------
           CC Section (dashboard "Credit Cards Outstanding")
           Overrides oat.ink's default <details>/<summary> card chrome
           so the section blends with the flat Recent Transactions look.
        --------------------------------------------------------------- */
        .cc-section > details {
            border: none;
            border-radius: 0;
            overflow: visible;
            padding: 0;
        }

        .cc-section > details > summary {
            border-bottom: none;
            padding: 0;
            margin-bottom: 0.75rem;
            background: transparent;
            font-weight: 700;
        }

        .cc-section > details > summary:hover {
            background: transparent;
        }

        .cc-section .cc-total {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            color: var(--clr-debit);
        }

        .cc-section table .cc-due-overdue {
            color: var(--clr-debit);
            font-weight: 600;
        }

        .cc-section table .cc-partial {
            display: block;
            font-size: 0.72rem;
            opacity: 0.55;
            font-weight: 400;
        }

        .cc-section table .cc-right {
            text-align: right;
            white-space: nowrap;
        }

        .cc-section table .cc-paid-toggle {
            padding: 0.6rem 0.75rem;
        }

        .cc-section table .cc-paid-toggle button {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: inherit;
            font-size: 0.82rem;
            opacity: 0.55;
            cursor: pointer;
        }

        .cc-section table .cc-paid-toggle button:hover {
            opacity: 0.85;
            text-decoration: underline;
        }

        .cc-section table .cc-paid-toggle button::before {
            content: "▸ ";
            display: inline-block;
            transition: transform 0.15s ease;
        }

        .cc-section table .cc-paid-toggle button[aria-expanded="true"]::before {
            transform: rotate(90deg);
        }

        .cc-section tbody.cc-paid {
            opacity: 0.6;
        }

        .cc-section tbody.cc-paid[hidden] {
            display: none;
        }

        /* ---------------------------------------------------------------
           Detail & Audit Views
        --------------------------------------------------------------- */
        .audit-row { position: relative; }
        .audit-row-link::after { content: ""; position: absolute; inset: 0; z-index: 1; }
        .audit-row-nested-link { position: relative; z-index: 2; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.75rem 1.25rem; margin: 0; }
        .detail-grid dt, .audit-action-grid dt { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.55; margin: 0; }
        .detail-grid dd { margin: 0.15rem 0 0 0; font-size: 0.92rem; }
        .detail-grid dd:empty::after { content: "\2014"; opacity: 0.35; }
        .audit-card { background: var(--surface-muted); border: 1px solid var(--border-light); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
        .audit-section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.65; margin: 1.5rem 0 0.6rem 0; }
        .audit-prose { white-space: pre-wrap; word-break: break-word; background: var(--surface-muted); border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; }
        .audit-json, .audit-error { white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono); font-size: 0.78rem; margin: 0; overflow-x: auto; }
        .audit-json { background: var(--surface-inset); border: 1px solid var(--border-light); padding: 0.75rem 0.9rem; border-radius: 6px; }
        .audit-error { background: color-mix(in srgb, var(--clr-debit) 8%, var(--surface-muted)); border: 1px solid color-mix(in srgb, var(--clr-debit) 35%, var(--border-light)); padding: 0.85rem 1rem; border-radius: 8px; }
        .audit-action-card { border: 1px solid var(--border-light); border-radius: 8px; background: var(--surface-muted); margin-bottom: 0.75rem; padding: 0.75rem 1rem; }
        .audit-action-card > summary { cursor: pointer; font-weight: 600; }
        .audit-action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
        .audit-action-grid dt { margin-bottom: 0.25rem; }
        .jv { border: 1px solid var(--border-light); border-radius: 6px; overflow: hidden; background: var(--surface-inset); }
        .jv-toolbar { display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0.45rem 0.55rem; border-bottom: 1px solid var(--border-light); background: var(--surface-muted); }
        .jv-btn { font-family: var(--font-body); font-size: 0.72rem; font-weight: 600; padding: 0.18rem 0.55rem; border-radius: 999px; border: 1px solid var(--border-light); background: transparent; color: inherit; cursor: pointer; opacity: 0.7; }
        .jv-btn:hover { opacity: 1; background: var(--nav-pill-hover); }
        .jv-btn.is-active { opacity: 1; background: var(--nav-pill-active-bg); color: var(--nav-pill-active-fg); border-color: transparent; }
        .jv-tree { padding: 0.6rem 0.75rem; font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.55; max-height: 32rem; overflow: auto; }
        .jv-node, .jv-text { margin: 0.15rem 0; }
        .jv-summary { cursor: pointer; } .jv-summary::marker { opacity: 0.5; }
        .jv-children { margin-left: 0.85rem; padding-left: 0.65rem; border-left: 1px dashed var(--border-light); }
        .jv-row { padding-left: 1rem; white-space: pre-wrap; word-break: break-word; }
        .jv-key { color: var(--clr-credit); }
        .jv-meta { opacity: 0.5; font-size: 0.7rem; margin-left: 0.4rem; }
        .jv-bracket { opacity: 0.6; }
        .jv-string { color: var(--clr-credit); }
        .jv-preview { opacity: 0.85; }
        .jv-number { color: var(--clr-debit); }
        .jv-bool { color: var(--clr-pending-fg); }
        .jv-null { opacity: 0.5; font-style: italic; }
        .jv-multiline { white-space: pre-wrap; word-break: break-word; margin: 0.3rem 0 0.5rem 1rem; padding: 0.5rem 0.65rem; border-radius: 4px; background: var(--surface-muted); border: 1px solid var(--border-light); font-family: var(--font-mono); font-size: 0.76rem; }

        /* ---------------------------------------------------------------
           Footer
        --------------------------------------------------------------- */
        .app-footer {
            margin-top: 3rem;
            padding: 1.25rem 0;
            border-top: 1px solid var(--border-light);
            text-align: center;
            font-size: 0.78rem;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <h1 class="app-title"><a href="/">Ledger</a></h1>
        <nav class="app-nav">
            <a href="/" {% if active_page == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
            <a href="/transactions" {% if active_page == "transactions" %}aria-current="page"{% endif %}>Transactions</a>
            <a href="/audit" {% if active_page == "audit" %}aria-current="page"{% endif %}>Audit</a>
            <a href="/emails" {% if active_page == "emails" %}aria-current="page"{% endif %}>Emails</a>
            <a href="/sms" {% if active_page == "sms" %}aria-current="page"{% endif %}>SMS</a>
            <a href="/sources" {% if active_page == "sources" %}aria-current="page"{% endif %}>Sources</a>
            <a href="/accounts" {% if active_page == "accounts" %}aria-current="page"{% endif %}>Accounts</a>
            <a href="/cashflow" {% if active_page == "cashflow" %}aria-current="page"{% endif %}>Cashflow</a>
            <a href="/networth" {% if active_page == "networth" %}aria-current="page"{% endif %}>Net Worth</a>
            <a href="/receivables" {% if active_page == "receivables" %}aria-current="page"{% endif %}>Owed</a>
            <a href="/statements" {% if active_page == "statements" %}aria-current="page"{% endif %}>Statements</a>
            <a href="/rules" {% if active_page == "rules" %}aria-current="page"{% endif %}>Rules</a>
            <a href="/extensions" {% if active_page == "extensions" %}aria-current="page"{% endif %}>Extensions</a>
            <a href="/settings" {% if active_page == "settings" %}aria-current="page"{% endif %}>Settings</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <small>Ledger &mdash; bank, CC, investments &amp; manual, in one place</small>
    </footer>

    <dialog id="detail-modal" style="max-width: 700px; width: 90vw; max-height: 85vh; border-radius: 12px; padding: 0; border: 1px solid var(--border-light); position: relative; overflow: hidden;">
        <div style="position: sticky; top: 0; display: flex; justify-content: flex-end; padding: 0.5rem 0.75rem 0; z-index: 1;">
            <form method="dialog" style="margin: 0;">
                <button type="submit" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.4; color: inherit; padding: 0.25rem 0.5rem; line-height: 1;">&times;</button>
            </form>
        </div>
        <div id="detail-modal-content" style="padding: 0 1.5rem 1.5rem; overflow-y: auto; max-height: calc(85vh - 3rem);">
            <p>Loading...</p>
        </div>
    </dialog>

    <script>
    const detailModal = document.getElementById('detail-modal');
    const detailContent = document.getElementById('detail-modal-content');

    async function openDetailModal(url) {
        detailContent.innerHTML = '<p style="text-align:center; padding: 2rem;">Loading...</p>';
        // Prevent body scroll while dialog is open
        const scrollY = window.scrollY;
        document.body.style.position = 'fixed';
        document.body.style.top = `-${scrollY}px`;
        document.body.style.left = '0';
        document.body.style.right = '0';
        detailModal.showModal();
        try {
            const resp = await fetch(url);
            detailContent.innerHTML = await resp.text();
            detailContent.querySelectorAll('script').forEach(old => {
                const s = document.createElement('script');
                for (const a of old.attributes) s.setAttribute(a.name, a.value);
                s.textContent = old.textContent;
                old.replaceWith(s);
            });
        } catch (e) {
            detailContent.innerHTML = '<p style="color:var(--clr-debit);">Failed to load details.</p>';
        }
    }

    // Restore scroll position on close
    detailModal.addEventListener('close', () => {
        const scrollY = Math.abs(parseInt(document.body.style.top || '0', 10));
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        window.scrollTo(0, scrollY);
    });

    // Close on backdrop click
    detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) detailModal.close();
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
